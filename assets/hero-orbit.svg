<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111315" />
      <stop offset="100%" stop-color="#08090A" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#92999F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#111315" />
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)" rx="12"/>
  <circle cx="600" cy="250" r="180" fill="url(#amberGlow)" />
  
  <!-- Orbital Rings -->
  <ellipse cx="600" cy="250" rx="340" ry="110" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" transform="rotate(-15 600 250)"/>
  <ellipse cx="600" cy="250" rx="260" ry="80" fill="none" stroke="#92999F" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" transform="rotate(25 600 250)"/>
  <ellipse cx="600" cy="250" rx="180" ry="180" fill="none" stroke="#FF6B00" stroke-width="0.75" opacity="0.6"/>
  
  <!-- Central Planet Core -->
  <circle cx="600" cy="250" r="90" fill="#08090A" stroke="#FF6B00" stroke-width="2"/>
  <circle cx="600" cy="250" r="82" fill="none" stroke="#F1F3F4" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5"/>
  
  <!-- Trajectory Points -->
  <circle cx="340" cy="215" r="4" fill="#FF6B00" />
  <circle cx="780" cy="300" r="3" fill="#F1F3F4" />
  <circle cx="600" cy="70" r="3" fill="#FF6B00" />
  <circle cx="480" cy="210" r="2.5" fill="#92999F" />
  <circle cx="710" cy="270" r="3.5" fill="#FF6B00" />
  
  <!-- Grid Lines Overlay -->
  <line x1="200" y1="250" x2="1000" y2="250" stroke="#92999F" stroke-width="0.5" opacity="0.15" stroke-dasharray="6 6"/>
  <line x1="600" y1="50" x2="600" y2="450" stroke="#92999F" stroke-width="0.5" opacity="0.15" stroke-dasharray="6 6"/>
</svg>
