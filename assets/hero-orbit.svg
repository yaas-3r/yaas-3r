<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%">
  <defs>
    <style>
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.85; transform: scale(1.02); }
      }
      @keyframes reticleScan {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.9; }
      }
      .orbit-ring-1 { transform-origin: 850px 240px; animation: orbitRotate 20s linear infinite; }
      .orbit-ring-2 { transform-origin: 850px 240px; animation: orbitReverse 35s linear infinite; }
      .core-glow { transform-origin: 850px 240px; animation: pulseGlow 4s ease-in-out infinite; }
      .reticle-pulse { animation: reticleScan 3s ease-in-out infinite; }
    </style>

    <radialGradient id="bgGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A0D03" />
      <stop offset="50%" stop-color="#0E0B08" />
      <stop offset="100%" stop-color="#08090A" />
    </radialGradient>

    <radialGradient id="amberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FF6B00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="amberStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF6B00" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Matte Background -->
  <rect width="1200" height="480" fill="#08090A" rx="10"/>
  <rect width="1200" height="480" fill="url(#bgGlow)" rx="10"/>

  <!-- Scanning Grid Overlay -->
  <g opacity="0.08" stroke="#F1F3F4" stroke-width="0.75">
    <line x1="60" y1="0" x2="60" y2="480"/>
    <line x1="1140" y1="0" x2="1140" y2="480"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- Futuristic Corner Markers -->
  <g stroke="#FF6B00" stroke-width="2" fill="none" class="reticle-pulse">
    <path d="M 40 80 L 40 40 L 80 40" />
    <path d="M 1160 80 L 1160 40 L 1120 40" />
    <path d="M 40 400 L 40 440 L 80 440" />
    <path d="M 1160 400 L 1160 440 L 1120 440" />
  </g>

  <!-- Horizontal Anamorphic Ray -->
  <line x1="40" y1="240" x2="1160" y2="240" stroke="url(#amberStreak)" stroke-width="1" opacity="0.6"/>

  <!-- ANIMATED ORBITAL SPHERE SYSTEM -->
  <g id="orbital-system">
    <!-- Glowing Core Atmosphere -->
    <circle cx="850" cy="240" r="140" fill="url(#amberCore)" class="core-glow"/>

    <!-- Dark Central Sphere Planet -->
    <circle cx="850" cy="240" r="75" fill="#0A0B0D" stroke="#FF6B00" stroke-width="1.5"/>
    <circle cx="850" cy="240" r="68" fill="none" stroke="#F1F3F4" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.4"/>

    <!-- Rotating Outer Elliptical Ring 1 -->
    <g class="orbit-ring-1">
      <ellipse cx="850" cy="240" rx="220" ry="70" fill="none" stroke="#FF6B00" stroke-width="1.2" opacity="0.75" transform="rotate(-25 850 240)"/>
      <circle cx="650" cy="200" r="4" fill="#FF6B00"/>
      <circle cx="1050" cy="280" r="3" fill="#F1F3F4"/>
    </g>

    <!-- Rotating Inner Elliptical Ring 2 (Counter-Clockwise) -->
    <g class="orbit-ring-2">
      <ellipse cx="850" cy="240" rx="160" ry="160" fill="none" stroke="#92999F" stroke-width="0.75" stroke-dasharray="8 12" opacity="0.5" transform="rotate(35 850 240)"/>
      <circle cx="850" cy="80" r="3.5" fill="#FF6B00"/>
    </g>
  </g>

  <!-- Typography & Identity Header -->
  <text x="80" y="160" fill="#F1F3F4" font-family="'Helvetica Neue', system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="10">YAASIR MOHAMMAD</text>
  <text x="80" y="200" fill="#FF6B00" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="6">OBSIDIAN MOTION &nbsp;&mdash;&nbsp; SYSTEM &amp; FRAME</text>
  <text x="80" y="255" fill="#92999F" font-family="system-ui, sans-serif" font-size="15" letter-spacing="1">Software Engineering &bull; Mobile Systems &bull; Cinematography</text>

  <!-- Telemetry Metadata Bar -->
  <rect x="80" y="320" width="460" height="40" fill="#111315" rx="4" stroke="#FF6B00" stroke-width="0.5" opacity="0.8"/>
  <text x="100" y="345" fill="#FF6B00" font-family="monospace" font-size="11" letter-spacing="2">SYS: ONLINE // REPO: YAAS-3R // BUILDING: RIDERA</text>
</svg>
