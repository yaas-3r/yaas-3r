<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A"/>
      <stop offset="50%" stop-color="#0F1113"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="lensFlare" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08090A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF6B00" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FF6B00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" rx="8"/>
  <rect width="1200" height="420" fill="url(#lensFlare)" rx="8"/>

  <!-- Technical Lens Focus Grid -->
  <g opacity="0.12" stroke="#F1F3F4" stroke-width="0.75">
    <line x1="80" y1="40" x2="80" y2="380"/>
    <line x1="1120" y1="40" x2="1120" y2="380"/>
    <line x1="40" y1="80" x2="1160" y2="80"/>
    <line x1="40" y1="340" x2="1160" y2="340"/>
  </g>

  <!-- Framing Corners -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
  <path d="M 1140 100 L 1140 60 L 1100 60" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
  <path d="M 60 320 L 60 360 L 100 360" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
  <path d="M 1140 320 L 1140 360 L 1100 360" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>

  <!-- Anamorphic Streak Line -->
  <line x1="100" y1="210" x2="1100" y2="210" stroke="url(#amberLine)" stroke-width="1.5"/>

  <!-- Center Aperture Geometry -->
  <circle cx="840" cy="210" r="110" fill="none" stroke="#F1F3F4" stroke-width="0.5" opacity="0.2"/>
  <circle cx="840" cy="210" r="85" fill="none" stroke="#FF6B00" stroke-width="1" opacity="0.5" stroke-dasharray="6 8"/>
  <circle cx="840" cy="210" r="6" fill="#FF6B00"/>

  <!-- Identity Typography -->
  <text x="100" y="160" fill="#F1F3F4" font-family="'Helvetica Neue', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="12">YAASIR MOHAMMAD</text>
  <text x="100" y="200" fill="#FF6B00" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="6">FRAME / FUNCTION &nbsp;&mdash;&nbsp; SYSTEM &amp; STILL</text>
  <text x="100" y="255" fill="#92999F" font-family="system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="2">Software Engineer &amp; Cinematographer based in Kenya.</text>
  <text x="100" y="280" fill="#92999F" font-family="system-ui, sans-serif" font-size="13" font-weight="400" letter-spacing="1">Building Ridera platform &bull; Crafting visual motion &bull; Exploring systems &amp; AI</text>

  <!-- Technical Metadata -->
  <text x="100" y="355" fill="#FF6B00" font-family="monospace" font-size="11" opacity="0.7">CAM: 24FPS // SYS: RUST &bull; NODE &bull; TS // LOC: NAIROBI, KE</text>
</svg>
