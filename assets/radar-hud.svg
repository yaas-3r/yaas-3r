<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" style="background:#08090A; border-radius:8px;">
  <defs>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }
      .radar-sweep { transform-origin: 680px 80px; animation: spin 8s linear infinite; }
      .hud-pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Background Grid -->
  <path d="M0 40 H800 M0 80 H800 M0 120 H800 M200 0 V160 M400 0 V160 M600 0 V160" stroke="#111315" stroke-width="1"/>

  <!-- Profile Metadata (Left) -->
  <text x="35" y="60" fill="#F1F3F4" font-family="'Fira Code', monospace" font-size="24" font-weight="800" letter-spacing="3">YAASIR MOHAMMAD</text>
  <text x="35" y="92" fill="#FF6B00" font-family="'Fira Code', monospace" font-size="13" font-weight="600" letter-spacing="2">ENGINEERING &bull; CINEMATOGRAPHY &bull; MOTION</text>
  <text x="35" y="120" fill="#92999F" font-family="'Fira Code', monospace" font-size="11">[LOC: KENYA] &bull; [PROJECT: RIDERA] &bull; [SYS: ONLINE]</text>

  <!-- Radar Target Visual (Right) -->
  <circle cx="680" cy="80" r="55" fill="none" stroke="#FF6B00" stroke-width="1" class="hud-pulse"/>
  <circle cx="680" cy="80" r="35" fill="none" stroke="#92999F" stroke-width="0.5" stroke-dasharray="4 4"/>
  <circle cx="680" cy="80" r="4" fill="#FF6B00"/>
  
  <!-- Rotating Radar Line -->
  <g class="radar-sweep">
    <line x1="680" y1="80" x2="735" y2="80" stroke="#FF6B00" stroke-width="2"/>
  </g>

  <!-- Corner Framing Reticles -->
  <path d="M 15 25 L 15 12 L 28 12" fill="none" stroke="#FF6B00" stroke-width="2"/>
  <path d="M 785 25 L 785 12 L 772 12" fill="none" stroke="#FF6B00" stroke-width="2"/>
  <path d="M 15 135 L 15 148 L 28 148" fill="none" stroke="#FF6B00" stroke-width="2"/>
  <path d="M 785 135 L 785 148 L 772 148" fill="none" stroke="#FF6B00" stroke-width="2"/>
</svg>
