<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%">
  <defs>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A02"/>
      <stop offset="40%" stop-color="#08090A"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#filmGrad)" rx="8"/>
  <rect x="1" y="1" width="1198" height="498" fill="none" stroke="#FF6B00" stroke-width="0.75" opacity="0.4" rx="7"/>

  <!-- Anamorphic Camera Grid Lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#F1F3F4" stroke-width="0.5" opacity="0.1"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#F1F3F4" stroke-width="0.5" opacity="0.1"/>
  <line x1="200" y1="0" x2="200" y2="500" stroke="#F1F3F4" stroke-width="0.5" opacity="0.1"/>
  <line x1="1000" y1="0" x2="1000" y2="500" stroke="#F1F3F4" stroke-width="0.5" opacity="0.1"/>

  <!-- Lens Aperture Graphic -->
  <circle cx="950" cy="250" r="160" fill="none" stroke="#FF6B00" stroke-width="1" opacity="0.3"/>
  <circle cx="950" cy="250" r="120" fill="none" stroke="#F1F3F4" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="950" cy="250" r="8" fill="#FF6B00"/>

  <!-- Film Title & Details -->
  <text x="80" y="330" fill="#F1F3F4" font-family="'Georgia', serif" font-size="36" letter-spacing="4">FRAME 01 &mdash; SILENT HORIZON</text>
  <text x="80" y="370" fill="#FF6B00" font-family="system-ui" font-size="13" font-weight="700" letter-spacing="4">FEATURED CINEMATOGRAPHY REEL &bull; 2.39:1 ANAMORPHIC</text>
  <text x="80" y="410" fill="#92999F" font-family="system-ui" font-size="13">Director of Photography &amp; Colorist &bull; High-contrast landscape and movement study.</text>
</svg>
